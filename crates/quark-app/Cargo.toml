[package]
name = "quark-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "quark"
path = "src/main.rs"

[dependencies]
quark-core.workspace = true
quark-pdf.workspace = true
quark-ui.workspace = true
quark-ai.workspace = true
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
image.workspace = true
chrono.workspace = true
# Not Windows-only: the credential calls the assistant makes are used on every
# platform, and the crate compiles to "not supported" stubs off Windows.
quark-shell.workspace = true
# OCR by tesseract, and later TeX.
quark-lab.workspace = true
# The LaTeX editor: Vim, and LaTeX's colours.
quark-modal.workspace = true
quark-syntax.workspace = true
quark-text.workspace = true
quark-lsp.workspace = true
quark-tex.workspace = true
quark-literature.workspace = true
crossbeam-channel.workspace = true

[dev-dependencies]
quark-pdf = { workspace = true, features = ["testutil"] }

[build-dependencies]
ico.workspace = true
winresource.workspace = true
